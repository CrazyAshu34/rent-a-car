services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: rentacar
      MYSQL_USER: rentacar
      MYSQL_PASSWORD: rentacar
    ports:
      - "127.0.0.1:3307:3306" # 3307 avoids clashing with a native MySQL on 3306
    volumes:
      - dbdata:/var/lib/mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--default-time-zone=+00:00"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  dbdata:
